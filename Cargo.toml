[package]
name = "cica"
version = "0.14.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Telegram bot
teloxide = { version = "0.13", features = ["macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"

# Platform directories (XDG, etc.)
directories = "6"

# CLI
clap = { version = "4", features = ["derive"] }

# Interactive prompts
dialoguer = "0.11"

# HTTP client for downloads
reqwest = { version = "0.12", features = ["stream"] }

# Archive extraction
flate2 = "1"
tar = "0.4"
zip = "2"

# Command lookup
which = "7"

# Semver ranges for pinned dependency versions
semver = "1"

# JSON-RPC client (for signal-cli)
jsonrpsee = { version = "0.24", features = ["async-client", "http-client"] }

# Vector embeddings (local ONNX inference)
fastembed = "5"

# SQLite with vector search
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1.7-alpha.2"

# Cron job scheduling
croner = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
libc = "0.2"

# Slack
slack-morphism = { version = "2", features = ["hyper"] }

# Inbound HTTP (Linear webhooks). hyper is already in the tree via slack-morphism.
axum = "0.8"

# Webhook signature verification (HMAC-SHA256 over the raw body)
hmac = "0.12"
hex = "0.4"
subtle = "2"

# TLS (needed for slack-morphism)
rustls = { version = "0.23", features = ["aws-lc-rs"] }

# Lightweight regex for Slack markdown conversion
regex-lite = "0.1"

# MIME type detection for file uploads
mime_guess = "2"

# S3 state store (feature "s3")
aws-config = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", optional = true }

# Fargate launcher (feature "fargate")
aws-sdk-ecs = { version = "1", optional = true }

[features]
default = []
s3 = ["dep:aws-config", "dep:aws-sdk-s3"]
fargate = ["s3", "dep:aws-sdk-ecs"]
cloud = ["fargate"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
